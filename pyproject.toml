[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gwr-inversion"
version = "1.2.0"
description = "GWR Algorithm Numerical Laplace Inversion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
authors = [
    { name = "David S. Fulford", email = "petbox.dev@gmail.com" },
]
keywords = ["laplace", "inversion", "transform", "gwr"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.17",
    "mpmath>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/petbox-dev/gwr"

[tool.setuptools]
packages = ["gwr_inversion"]

[project.optional-dependencies]
fast = ["gmpy2>=2.1.0"]
flint = ["python-flint>=0.9.0"]
all = ["gmpy2>=2.1.0", "python-flint>=0.9.0"]

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "docs/conf.py",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
]

[tool.ruff.lint]
ignore = [
    "F401",    # unused import
    "F841",    # unused variable
    "E116",    # unexpected indentation (comment)
    "E251",    # unexpected spaces around keyword / parameter default
    "E261",    # at least two spaces before inline comment
    "E265",    # block comment should start with '# '
    "E266",    # too many leading '#' for block comment
    "E302",    # expected 2 blank lines
    "E305",    # expected 2 blank lines after class or function definition
    "E402",    # module level import not at top of file
    "E722",    # do not use bare 'except'
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mpmath", "mpmath.*", "gmpy2", "gmpy2.*", "flint", "flint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "pass",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
ignore_errors = true

[tool.coverage.html]
directory = "test/htmlcov"
