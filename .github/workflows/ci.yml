# Tests on every supported Python and builds the distribution.
#
# gwr-inversion is pure Python: one py3-none-any wheel serves every version, so
# the build job makes it once. The test matrix is what checks each version.
# Nothing here publishes to PyPI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. Other events group
# by commit, so every push to main keeps its own completed run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # bash on every OS: the Windows default (pwsh) checks only the last command
    # of a multi-line step.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # The persistent process pool uses the default start method: spawn on
          # Windows and macOS, fork on Linux to 3.13 and forkserver from 3.14
          # (docs/todo/open/parallel-pool-keeps-running-after-a-failed-call.md).
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with every extra
        # gmpy2 and python-flint from wheels only: a Python without published
        # wheels fails here rather than compiling them.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=gmpy2,python-flint -e ".[all]" pytest
      - name: Check the fast backends and scipy are in use
        # Without them their tests skip and the run would still pass.
        run: python -c "import scipy, gwr_inversion as g; print('gmpy2', g.HAS_GMPY2, 'flint', g.HAS_FLINT); assert g.HAS_GMPY2 and g.HAS_FLINT"
      - name: Run the tests
        run: python -m pytest test/ -q

  test-without-optional-dependencies:
    # The mpmath-only fallback path. The five reference tests that pin the gmpy2
    # backend's rounding skip themselves here (test/backend_markers.py,
    # docs/todo/open/reference-tests-require-gmpy2.md).
    name: test (ubuntu-latest, Python 3.12, numpy + mpmath only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Check no optional dependency is present
        run: python -c "import importlib.util as util; found = [name for name in ('gmpy2', 'flint', 'scipy') if util.find_spec(name)]; assert not found, found"
      - name: Run the tests
        run: python -m pytest test/ -q -rs

  minimum-versions:
    # Every dependency at the floor pyproject.toml declares (uv lowest-direct reads
    # them from there, so the floors have one source).
    name: test (ubuntu-latest, Python 3.10, minimum dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install the lowest allowed versions
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[all]" "pytest>=8"
          uv pip list --system
      - name: Check the fast backends and scipy are in use
        run: python -c "import scipy, gwr_inversion as g; print('gmpy2', g.HAS_GMPY2, 'flint', g.HAS_FLINT); assert g.HAS_GMPY2 and g.HAS_FLINT"
      - name: Run the tests
        run: python -m pytest test/ -q

  lint:
    # Python 3.10 is the floor, so mypy checks against the oldest supported
    # syntax. Tool versions are pinned: a new ruff release can add default rules.
    name: lint (ruff, mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "ruff==0.16.1" "mypy==2.3.0"
      - name: ruff
        run: ruff check gwr_inversion/
      - name: mypy
        run: mypy gwr_inversion/

  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import math, gwr_inversion; value = gwr_inversion.gwr(lambda s: 1 / (s + 1), 1.0); print(value); assert abs(value - math.exp(-1)) < 1e-9"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
