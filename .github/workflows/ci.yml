# Tests on every supported Python and builds the distribution.
#
# gwr-inversion is pure Python: one py3-none-any wheel serves every version, so
# the build job makes it once. The test matrix is what checks each version.
# Nothing here publishes to PyPI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. Other events group
# by commit, so every push to main keeps its own completed run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # bash on every OS: the Windows default (pwsh) checks only the last command
    # of a multi-line step.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # The persistent process pool uses the default start method: spawn on
          # Windows and macOS, fork on Linux to 3.13 and forkserver from 3.14
          # (docs/todo/open/parallel-pool-keeps-running-after-a-failed-call.md).
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with scipy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hybrid]" pytest
      - name: Install gmpy2 and python-flint from wheels
        # No source builds: a Python without published wheels fails here rather
        # than compiling them.
        run: |
          python -m pip install --only-binary=:all: "gmpy2>=2.1.0" "python-flint>=0.9.0"
      - name: Check the fast backends and scipy are in use
        # Without them their tests skip and the run would still pass.
        run: python -c "import scipy, gwr_inversion as g; print('gmpy2', g.HAS_GMPY2, 'flint', g.HAS_FLINT); assert g.HAS_GMPY2 and g.HAS_FLINT"
      - name: Run the tests
        run: python -m pytest test/ -q

  test-without-optional-dependencies:
    # The mpmath-only fallback path. The five tests the -k expression excludes
    # (it must stay exact: --deselect matches node-ID prefixes, so it would also
    # drop test_scalar_returns_float and its siblings) compare against
    # test/reference_data.npz, which pins the gmpy2 backend's rounding, and fail
    # on mpmath (docs/todo/open/reference-tests-require-gmpy2.md). Remove this
    # list when that item closes.
    name: test (ubuntu-latest, Python 3.12, numpy + mpmath only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Check no optional dependency is present
        run: python -c "import importlib.util as util; found = [name for name in ('gmpy2', 'flint', 'scipy') if util.find_spec(name)]; assert not found, found"
      - name: Run the tests
        run: >
          python -m pytest test/ -q -k "not (TestLnT and test_m4)
          and not (TestUnitStep and test_m8)
          and not (TestInputTypes and not returns and (test_scalar or test_list or test_ndarray))"

  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import math, gwr_inversion; value = gwr_inversion.gwr(lambda s: 1 / (s + 1), 1.0); print(value); assert abs(value - math.exp(-1)) < 1e-9"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
