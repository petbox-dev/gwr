# Publishes to PyPI when a GitHub Release is created (same pattern as dca and tafra).
#
# gwr-inversion is pure Python: one py3-none-any wheel plus the sdist. Uploads use
# PyPI trusted publishing (no token stored here); the gwr-inversion project on
# pypi.org must list this repository, this workflow file (publish.yml) and the
# "pypi" environment as a trusted publisher.
#
# Run it by hand (workflow_dispatch) from a tag, not a branch: the version check
# below compares the ref name with the version in pyproject.toml.

name: Publish to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        shell: bash
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "::error::ref ${GITHUB_REF_NAME} does not match pyproject.toml version v${package_version}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist/
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import gwr_inversion; print(gwr_inversion.gwr(lambda s: 1 / (s + 1), 1.0))"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
